name: Build Standalone Executables with Nuitka

on:
  push:
    branches:
      - dev01
  pull_request:
    branches:
      - dev01

env:
  RELEASE_VERSION: "v0.1.2" # Set your desired release version here
  RELEASE_DESCRIPTION: |
    ## Automated Release Notes
    This release includes standalone executables for:
    - Python 3.8
    - Python 3.10

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetches the entire history so the repository is a full clone

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          pip install nuitka paho-mqtt

      - name: Build the executable with Nuitka (Static libpython)
        run: |
          cd src
          python -m nuitka --onefile --standalone --include-module=paho.mqtt.client --output-dir=../build --output-filename=oblockperf_${{ matrix.python-version }} --static-libpython=yes blockperf/cli.py

      - name: Package the output
        run: |
          cd build
          tar -czvf oblockperf_${{ matrix.python-version }}.tar.gz oblockperf_${{ matrix.python-version }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oblockperf-${{ matrix.python-version }}
          path: build/oblockperf_${{ matrix.python-version }}.tar.gz

  create_release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch the entire history including tags

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: oblockperf-${{ matrix.python-version }}
          path: ./artifacts # Specify the path to store downloaded artifacts

      - name: Create a release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.RELEASE_VERSION }} --notes "${{ env.RELEASE_DESCRIPTION }}"

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ env.RELEASE_VERSION }} ./artifacts/oblockperf-3.8.tar.gz ./artifacts/oblockperf-3.10.tar.gz
